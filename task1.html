<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinGuard - Облік фінансів</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-item h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-item p {
            font-size: 18px;
            font-weight: bold;
        }

        .stat-balance p {
            color: #2196F3;
        }

        .stat-income p {
            color: #4CAF50;
        }

        .stat-expense p {
            color: #F44336;
        }

        .convert-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .btn {
            background-color: #2196F3;
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn:hover {
            background-color: #1e88e5;
        }

        .converted-rates {
            margin-top: 10px;
            font-size: 14px;
            color: #555;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .error-message {
            color: #F44336;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .transactions-list {
            list-style: none;
            margin-top: 20px;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            border-left: 5px solid;
            background: #fafafa;
        }

        .transaction-item.income {
            border-left-color: #4CAF50;
        }

        .transaction-item.expense {
            border-left-color: #F44336;
        }

        .transaction-info {
            display: flex;
            flex-direction: column;
        }

        .transaction-title {
            font-weight: bold;
        }

        .transaction-date {
            font-size: 12px;
            color: #888;
        }

        .transaction-amount {
            font-weight: bold;
        }

        .transaction-amount.income {
            color: #4CAF50;
        }

        .transaction-amount.expense {
            color: #F44336;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #999;
            font-size: 18px;
            cursor: pointer;
            margin-left: 10px;
        }

        .delete-btn:hover {
            color: #F44336;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>CoinGuard</h1>

        <div class="stats">
            <div class="stat-item stat-balance">
                <h3>Загальний баланс</h3>
                <p id="totalBalance">0 ₴</p>
            </div>
            <div class="stat-item stat-income">
                <h3>Всього доходів</h3>
                <p id="totalIncome">0 ₴</p>
            </div>
            <div class="stat-item stat-expense">
                <h3>Всього витрат</h3>
                <p id="totalExpense">0 ₴</p>
            </div>
        </div>

        <div class="convert-section">
            <button id="convertBtn" class="btn">Конвертувати баланс</button>
            <div id="convertedRates" class="converted-rates"></div>
        </div>

        <form id="transactionForm">
            <div class="form-group">
                <label for="textInput">Назва транзакції</label>
                <input type="text" id="textInput" placeholder="Наприклад: Купівля продуктів">
            </div>

            <div class="form-group">
                <label for="amountInput">Сума (₴)</label>
                <input type="number" id="amountInput" placeholder="1500" step="any">
            </div>

            <div class="form-group">
                <label for="typeSelect">Тип транзакції</label>
                <select id="typeSelect">
                    <option value="income">Дохід (+)</option>
                    <option value="expense">Витрата (-)</option>
                </select>
            </div>

            <div id="formError" class="error-message"></div>

            <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Додати транзакцію</button>
        </form>

        <ul id="transactionsList" class="transactions-list"></ul>
    </div>

    <script>
        let transactions = JSON.parse(localStorage.getItem('coinguard_transactions')) || [];

        const form = document.getElementById('transactionForm');
        const textInput = document.getElementById('textInput');
        const amountInput = document.getElementById('amountInput');
        const typeSelect = document.getElementById('typeSelect');
        const formError = document.getElementById('formError');

        const totalBalanceEl = document.getElementById('totalBalance');
        const totalIncomeEl = document.getElementById('totalIncome');
        const totalExpenseEl = document.getElementById('totalExpense');

        const transactionsList = document.getElementById('transactionsList');

        const convertBtn = document.getElementById('convertBtn');
        const convertedRates = document.getElementById('convertedRates');

        function saveToLocalStorage() {
            localStorage.setItem('coinguard_transactions', JSON.stringify(transactions));
        }

        function calculateStats() {
            const income = transactions
                .filter(trx => trx.type === 'income')
                .reduce((sum, trx) => sum + trx.amount, 0);

            const expense = transactions
                .filter(trx => trx.type === 'expense')
                .reduce((sum, trx) => sum + trx.amount, 0);

            const balance = income - expense;

            totalBalanceEl.textContent = `${balance.toFixed(2)} ₴`;
            totalIncomeEl.textContent = `${income.toFixed(2)} ₴`;
            totalExpenseEl.textContent = `${expense.toFixed(2)} ₴`;

            return balance;
        }

        function renderTransactions() {
            transactionsList.innerHTML = '';

            transactions.forEach(trx => {
                const li = document.createElement('li');
                li.className = `transaction-item ${trx.type}`;

                const isIncome = trx.type === 'income';
                const sign = isIncome ? '+' : '-';

                li.innerHTML = `
          <div class="transaction-info">
            <span class="transaction-title">${trx.text}</span>
            <span class="transaction-date">${trx.date}</span>
          </div>
          <div style="display: flex; align-items: center;">
            <span class="transaction-amount ${trx.type}">${sign}${trx.amount.toFixed(2)} ₴</span>
            <button class="delete-btn" onclick="deleteTransaction('${trx.id}')">&times;</button>
          </div>
        `;

                transactionsList.appendChild(li);
            });

            calculateStats();
        }

        function addTransaction(e) {
            e.preventDefault();

            const text = textInput.value.trim();
            const amount = parseFloat(amountInput.value);
            const type = typeSelect.value;

            formError.style.display = 'none';
            formError.textContent = '';

            if (!text) {
                showError('Будь ласка, введіть назву транзакції.');
                return;
            }

            if (isNaN(amount) || amount <= 0) {
                showError('Сума повинна бути числом і більшою за нуль.');
                return;
            }

            const today = new Date().toISOString().split('T')[0];

            const newTrx = {
                id: 'trx-' + Date.now(),
                text: text,
                amount: amount,
                type: type,
                date: today
            };

            transactions.push(newTrx);
            saveToLocalStorage();
            renderTransactions();

            textInput.value = '';
            amountInput.value = '';
            typeSelect.value = 'income';
        }

        function showError(msg) {
            formError.textContent = msg;
            formError.style.display = 'block';
        }

        function deleteTransaction(id) {
            transactions = transactions.filter(trx => trx.id !== id);
            saveToLocalStorage();
            renderTransactions();
        }

        async function convertBalance() {
            convertedRates.textContent = 'Отримання курсу...';

            try {
                const response = await fetch('https://api.exchangerate-api.com/v4/latest/UAH');
                if (!response.ok) {
                    throw new Error('Помилка мережі');
                }

                const data = await response.json();
                const currentBalance = calculateStats();

                const usdRate = data.rates.USD;
                const eurRate = data.rates.EUR;

                const balanceInUSD = (currentBalance * usdRate).toFixed(2);
                const balanceInEUR = (currentBalance * eurRate).toFixed(2);

                convertedRates.textContent = `Баланс: $${balanceInUSD} (USD) / €${balanceInEUR} (EUR)`;
            } catch (error) {
                convertedRates.textContent = 'Помилка завантаження курсу валют';
            }
        }

        form.addEventListener('submit', addTransaction);
        convertBtn.addEventListener('click', convertBalance);

        renderTransactions();
    </script>
</body>

</html>
