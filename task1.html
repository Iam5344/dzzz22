<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
</head>
<body>

  <script>


    function calculate(a, b, onSuccess, onError) {
      if (b === 0) {
        onError("Ділення на нуль заборонено");
      } else {
        onSuccess(a / b);
      }
    }

    function onSuccess(result) {
      console.log(`Результат: ${result}`);
    }

    function onError(error) {
      console.log(`Помилка: ${error}`);
    }

    console.log("--- Завдання 1 ---");
    calculate(10, 2, onSuccess, onError);
    calculate(10, 0, onSuccess, onError); 


    function processArray(array, callback) {
      const result = [];
      for (let i = 0; i < array.length; i++) {
        const res = callback(array[i]);
        if (res !== undefined) {
          result.push(res);
        }
      }
      return result.length > 0 ? result : undefined;
    }

    function logElement(element) {
      console.log(element);
    }

    function squareElement(element) {
      return element * element;
    }

    console.log("\n--- Завдання 2 ---");
    processArray([1, 2, 3, 4, 5], logElement);
    console.log("Результат:", processArray([1, 2, 3, 4, 5], squareElement));



    function createOrder(orderId) {
      return new Promise((resolve) => {
        setTimeout(() => {
          resolve(`Замовлення створено: ${orderId}`);
        }, 1000);
      });
    }

    function processOrder(orderId) {
      return new Promise((resolve) => {
        setTimeout(() => {
          resolve(`Замовлення оброблено: ${orderId}`);
        }, 2000);
      });
    }

    function deliverOrder(orderId) {
      return new Promise((resolve) => {
        setTimeout(() => {
          resolve(`Замовлення доставлено: ${orderId}`);
        }, 3000);
      });
    }

    console.log("\n--- Завдання 3 ---");
    const myOrderId = 101;

    createOrder(myOrderId)
      .then((msg) => {
        console.log(msg);
        return processOrder(myOrderId);
      })
      .then((msg) => {
        console.log(msg);
        return deliverOrder(myOrderId);
      })
      .then((msg) => {
        console.log(msg);
      });



    function checkEvenNumber(number) {
      return new Promise((resolve, reject) => {
        setTimeout(() => {
          if (number % 2 === 0) {
            resolve(`Парне число: ${number}`);
          } else {
            reject(`Непарне число: ${number}`);
          }
        }, 1000);
      });
    }


    setTimeout(() => {
      console.log("\n--- Завдання 4 ---");

      checkEvenNumber(4)
        .then((result) => console.log(result))
        .catch((error) => console.log(error));

      checkEvenNumber(7)
        .then((result) => console.log(result))
        .catch((error) => console.log(error));
    }, 6500);
  </script>
</body>
</html>
