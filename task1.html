<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
</head>
<body>


  <script>

    function multiplyAsync(a, b) {
      return new Promise((resolve, reject) => {
        setTimeout(() => {
          if (typeof a !== 'number' || typeof b !== 'number' || Number.isNaN(a) || Number.isNaN(b)) {
            reject("Некоректні значення");
          } else {
            resolve(a * b);
          }
        }, 2000);
      });
    }


    function sortArrayAsync(array) {
      return new Promise((resolve, reject) => {
        setTimeout(() => {
          if (!Array.isArray(array) || array.length === 0) {
            reject("Масив порожній");
          } else {
            const sortedArray = [...array].sort((a, b) => a - b);
            resolve(sortedArray);
          }
        }, 2000);
      });
    }

    async function main() {

      try {
        const multResult = await multiplyAsync(6, 9);
        console.log("Результат множення:", multResult);
      } catch (error) {
        console.log("Помилка множення:", error);
      }


      try {
        const sortedResult = await sortArrayAsync([42, 7, 19, 3, 88, 1]);
        console.log("Відсортований масив:", sortedResult);
      } catch (error) {
        console.log("Помилка сортування:", error);
      }
    }

    main();
  </script>
</body>
</html>
